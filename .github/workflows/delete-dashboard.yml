name: Delete Dashboard Paths (one-off)

# Manual-trigger only. Deletes one or more files/folders under dashboard/
# in a single commit and push. Does NOT touch manifest.json unless you
# explicitly include it in the paths list — deleting stream/org/channel
# folders without also clearing their manifest entries means the next
# live/backfill run will just regenerate them (since compute_dirty_set
# won't have re-seen them as dirty, they'll stay deleted until something
# marks them dirty again — e.g. a stream going live).
#
# Usage: trigger from the Actions tab, enter a comma-separated list of
# paths RELATIVE TO THE REPO ROOT, e.g.:
#   dashboard/some-old-org, dashboard/another-org/some-channel
#
# Safety: paths are restricted to start with "dashboard/" — the workflow
# refuses to run (and fails loudly) if any entry tries to escape that
# prefix, so a typo can't delete something outside the intended folder.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Comma-separated paths to delete (must start with "dashboard/")'
        required: true
      commit_message:
        description: 'Commit message'
        required: false
        default: 'chore: remove stale dashboard paths [skip ci]'

permissions:
  contents: write

concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

jobs:
  delete-paths:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Validate and delete requested paths
        run: |
          IFS=',' read -ra RAW_PATHS <<< "${{ github.event.inputs.paths }}"

          deleted=0
          for p in "${RAW_PATHS[@]}"; do
            # trim whitespace
            path=$(echo "$p" | xargs)

            if [[ -z "$path" ]]; then
              continue
            fi

            # Guard rail: only allow deletions inside dashboard/
            if [[ "$path" != dashboard/* ]]; then
              echo "REFUSING: '$path' does not start with 'dashboard/' — aborting entirely."
              exit 1
            fi

            # Guard rail: no path traversal
            if [[ "$path" == *".."* ]]; then
              echo "REFUSING: '$path' contains '..' — aborting entirely."
              exit 1
            fi

            if [[ -e "$path" ]]; then
              echo "Deleting: $path"
              rm -rf -- "$path"
              deleted=$((deleted + 1))
            else
              echo "Skipping (not found): $path"
            fi
          done

          echo "Done — $deleted path(s) removed."

      - name: Commit and push deletions
        run: |
          git config user.name  "IDVTuber Dashboard"
          git config user.email "dashboard@idvtuber-tracker"
          git add -A dashboard/
          if git diff --cached --quiet; then
            echo "Nothing changed — nothing to commit."
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
            echo "Deletions committed and pushed."
          fi
